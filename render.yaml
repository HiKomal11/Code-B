services:
  - type: web
    name: ngo-cms-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      # ✅ Apply migrations first, fail fast if they don’t run
      python manage.py migrate --noinput || exit 1
      # ✅ Collect static files
      python manage.py collectstatic --noinput
      # ✅ Create superuser only after migrations succeed
      python manage.py create_admin   # or: python manage.py createsuperuser --noinput
    startCommand: |
      # ✅ Ensure migrations are applied again at startup (safety net)
      python manage.py migrate --noinput && gunicorn ngo_cms.wsgi:application
    envVars:
      - key: DB_NAME
        value: ngo_db_hfxj
      - key: DB_USER
        value: ngo_db_hfxj_user
      - key: DB_PASSWORD
        value: q53HqXMEwla70tPiSLMCNj0Ospp5jTWO
      - key: DB_HOST
        value: dpg-d57vve9r0fns73dlodcg-a.virginia-postgres.render.com   # ✅ external hostname
      - key: DB_PORT
        value: 5432
      - key: SECRET_KEY
        value: django-insecure-x0nqmv+(&bp^jt_jf*y@jqny6jla=t25_pw@2a_gio5w$(ry6=
      - key: DEBUG
        value: False
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Admin@123
